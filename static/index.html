<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tyre Advisor</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/common.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="bar">
    <h1>Tyre Advisor</h1>
    <nav id="nav" hidden>
      <span id="who"></span>
      <a id="admin-link" href="/admin" hidden>Reference library</a>
      <button id="logout" type="button" class="link">Sign out</button>
    </nav>
  </header>

  <main>
    <section id="signin" class="card" hidden>
      <p>Upload a photo of your tyre and ask how many kilometres it has left.</p>
      <a class="button" href="/auth/login">Sign in to start</a>
    </section>

    <section id="app" hidden>
      <form id="upload" class="card">
        <h2>Check a tyre</h2>
        <label>Tyre photo (straight-on view of the tread; put a coin in the groove for scale)
          <input type="file" name="image" accept="image/jpeg,image/png,image/webp" capture="environment" required>
        </label>
        <img id="preview" alt="" hidden>
        <div class="row">
          <label>Vehicle
            <select name="vehicle_type">
              <option value="car">Car</option>
              <option value="suv">SUV</option>
              <option value="van">Van</option>
              <option value="light_truck">Light truck</option>
              <option value="motorcycle">Motorcycle</option>
            </select>
          </label>
          <label>Km since fitted (optional)
            <input type="number" name="km_since_fitted" min="0" max="300000" step="100">
          </label>
        </div>
        <label>Your question (optional)
          <input type="text" name="question" maxlength="2000" placeholder="How many more kilometres can I drive?">
        </label>
        <button type="submit">Analyse tyre</button>
        <p id="upload-status" class="muted" role="status"></p>
      </form>

      <section id="result" class="card" hidden>
        <div id="verdict" class="verdict"></div>
        <p id="summary"></p>
        <dl class="stats">
          <div><dt>Shallowest tread</dt><dd id="s-depth"></dd></div>
          <div><dt>Km to legal limit</dt><dd id="s-km"></dd></div>
          <div><dt>Km to recommended change</dt><dd id="s-rec"></dd></div>
          <div><dt>Confidence</dt><dd id="s-conf"></dd></div>
        </dl>
        <ul id="warnings" class="warnings"></ul>
        <ul id="advice"></ul>
        <p id="observations" class="muted"></p>
        <p id="disclaimer" class="disclaimer"></p>
      </section>

      <section id="chat" class="card" hidden>
        <h2>Ask about this tyre</h2>
        <ol id="messages" class="messages" aria-live="polite"></ol>
        <form id="ask" class="row">
          <input type="text" name="message" maxlength="2000" required placeholder="e.g. Is it safe for a 500 km trip?">
          <button type="submit">Send</button>
        </form>
      </section>
    </section>
  </main>
</body>
</html>
